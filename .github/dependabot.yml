# Keeps the SHA-pinned actions in .github/workflows current (the only third-party code this
# repo executes); Renovate handles the Kubernetes manifests separately.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "ci"
    reviewers:
      - "lukislp"
    open-pull-requests-limit: 2
