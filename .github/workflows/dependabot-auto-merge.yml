name: Dependabot auto-merge

# Thin caller of the shared implementation in lukislp/ci-workflows - the triggers stay here
# because a reusable workflow cannot declare them for the caller. Needs the AUTOMERGE_TOKEN
# repository secret (fine-grained PAT, contents + pull requests write).
on:
  pull_request_target:
    types: [opened, synchronize, reopened, auto_merge_enabled]
  schedule:
    - cron: "23 * * * *"
  push:
    branches: [main]

permissions:
  pull-requests: read

jobs:
  dependabot:
    uses: lukislp/ci-workflows/.github/workflows/dependabot-auto-merge.yml@4b19e87569c767e2855b4a53292d8edfe4065de4 # v1.8.3
    secrets:
      AUTOMERGE_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
