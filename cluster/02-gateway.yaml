# NGINX Gateway Fabric (Gateway API) - successor to ingress-nginx (archived by the Kubernetes
# project in 2026, see docs/SCALING.md). Installation of the controller/CRD manifests:
# k8s/06c-nginx-gateway-fabric.md. Parallel operation: this gateway gets its OWN MetalLB IP,
# ingress-nginx (192.168.1.240) stays untouched until the NPM cutover.
#
# Two listeners per service instead of one: NPM internally ALWAYS connects via SNI=X.heim.lan,
# but passes the public Host header through 1:1. A listener with hostname=X.heim.lan would
# IGNORE HTTPRoute hostnames outside that name (Gateway API spec: only the intersection of
# listener and route hostname binds) - the public Host header would end up at the 404 default
# backend. The second listener per service shares the TLS secret with the first; NGINX picks
# the certificate via SNI (always X.heim.lan), but the server block via the Host header -
# exactly the behavior of the previous two-host ingress rules.
#
# cert-manager (gateway-shim, --enable-gateway-api) generates a Certificate in the
# nginx-gateway namespace from the cluster-issuer annotation for each referenced secret - the
# existing same-named secrets in studylife-scale/monitoring (for the old ingress objects)
# remain unaffected by this.
apiVersion: gateway.nginx.org/v1alpha2
kind: NginxProxy
metadata:
  name: studylife-gateway-config
  namespace: nginx-gateway
spec:
  kubernetes:
    deployment:
      # Autoscaling instead of fixed replicas: NginxProxy has its OWN autoscaling field, which
      # NGF's provisioner deployment controller translates directly into an HPA object it manages
      # itself - no external HPA needed that would compete with the controller over
      # .spec.replicas (the controller continuously keeps this field in sync with the CRD; an
      # additional HPA would create the same field-ownership conflict that originally existed
      # for studylife-web/-worker before spec.replicas was removed).
      #
      # minReplicas: 3, matching the cluster's node count - NOT just "enough to spread", because
      # the LoadBalancer Service (below) sets externalTrafficPolicy: Local. Under Local, MetalLB
      # only serves traffic from a node that has its OWN local gateway pod; with fewer replicas
      # than nodes, whichever node draws the short straw at scale-down has NO local pod at all -
      # found live (2026-08-30) via a piwatch per-node alert firing for a node that had scaled
      # down to zero local replicas, well after the node itself had recovered from an unrelated
      # incident. 3 guarantees every node always has one, regardless which two the old minReplicas
      # 2 happened to land on.
      autoscaling:
        enable: true
        minReplicas: 3
        maxReplicas: 4
        targetCPUUtilizationPercentage: 70
        behavior:
          scaleDown:
            stabilizationWindowSeconds: 300 # same anti-flapping rule as for the web/worker HPA
      container:
        resources:
          requests: { cpu: 50m, memory: 90Mi }
          limits: { cpu: 200m, memory: 200Mi }
      pod:
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: studylife-gateway-nginx
                  topologyKey: kubernetes.io/hostname
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: studylife-gateway
  namespace: nginx-gateway
  annotations:
    cert-manager.io/cluster-issuer: studylife-internal-ca-issuer
spec:
  gatewayClassName: nginx
  infrastructure:
    # Pins the generated LoadBalancer Service to the fixed IP DNS already points at, so it
    # survives a MetalLB reload without depending on a manual, git-untracked annotation on the
    # generated Service (see 00-metallb-config.yaml's incident note - the same class of bug).
    annotations:
      metallb.io/loadBalancerIPs: 192.168.20.241
    parametersRef:
      group: gateway.nginx.org
      kind: NginxProxy
      name: studylife-gateway-config
  listeners:
    - name: studylife-heim
      hostname: studylife.heim.lan
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - { kind: Secret, name: studylife-tls }
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels: { kubernetes.io/metadata.name: studylife-scale }
    - name: studylife-public
      hostname: studylife.lukas2311-homelab.com
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - { kind: Secret, name: studylife-tls }
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels: { kubernetes.io/metadata.name: studylife-scale }
    - name: uptimekuma-heim
      hostname: uptimekuma.heim.lan
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - { kind: Secret, name: uptime-kuma-tls }
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            # Uptime Kuma moved to the monitoring namespace (was studylife-scale), see
            # monitoring/10-uptime-kuma.yaml - it now monitors the whole cluster, not just
            # studylife, so it belongs with the rest of the shared monitoring stack.
            matchLabels: { kubernetes.io/metadata.name: monitoring }
    - name: uptimekuma-public
      hostname: uptimekuma.lukas2311-homelab.com
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - { kind: Secret, name: uptime-kuma-tls }
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
    - name: grafana-heim
      hostname: grafana.heim.lan
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - { kind: Secret, name: grafana-tls }
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
    - name: grafana-public
      hostname: grafana.lukas2311-homelab.com
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - { kind: Secret, name: grafana-tls }
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
    - name: piwatch-heim
      hostname: piwatch.heim.lan
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - { kind: Secret, name: piwatch-tls }
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
    - name: piwatch-public
      hostname: piwatch.lukas2311-homelab.com
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - { kind: Secret, name: piwatch-tls }
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
    - name: homelab-hub-heim
      hostname: linkdashboard.heim.lan
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - { kind: Secret, name: homelab-hub-tls }
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels: { kubernetes.io/metadata.name: homelab-hub }
    - name: homelab-hub-public
      hostname: linkdashboard.lukas2311-homelab.com
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - { kind: Secret, name: homelab-hub-tls }
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels: { kubernetes.io/metadata.name: homelab-hub }
    # studylife-mcp (separate repo/namespace) - same -heim/-public pair as every other service
    # on this Gateway. Neither is actually "public internet" reachable - lukas2311-homelab.com
    # is only a vehicle for a trusted (Cloudflare-issued) cert on internal-only traffic, same
    # trust level as heim.lan, terminated by NPM inside the network (see this file's own header
    # comment on why two listeners share one cert: SNI is always *.heim.lan, but the public Host
    # header passes through 1:1). studylife-mcp's actual public/internet-reachable path is a
    # separate thing entirely - Tailscale Funnel, see that repo's docs/decisions.md.
    #
    # INCIDENT (fixed): this file used to say "home.lan"/"example.com" for every listener above
    # while the live Gateway object had already drifted to "heim.lan"/lukas2311-homelab.com -
    # adding just these two new listeners here and kubectl apply-ing the whole file silently
    # reverted every OTHER service's listener hostnames back to the stale values, breaking
    # route attachment (Gateway API only binds a Route whose hostname intersects a listener's -
    # "home.lan" HTTPRoutes and "heim.lan" listeners share no intersection) for the whole
    # cluster, not just studylife-mcp. All hostnames in this file now match the live object;
    # `kubectl apply -f` on this file is safe again. Lesson: for a file every future `kubectl
    # apply` re-applies in full, "leave the unrelated drift alone" isn't actually possible -
    # either the file matches live reality or applying it corrupts live reality.
    - name: studylife-mcp-heim
      hostname: studylife-mcp.heim.lan
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - { kind: Secret, name: studylife-mcp-tls }
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels: { kubernetes.io/metadata.name: studylife-mcp }
    - name: studylife-mcp-public
      hostname: studylife-mcp.lukas2311-homelab.com
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - { kind: Secret, name: studylife-mcp-tls }
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels: { kubernetes.io/metadata.name: studylife-mcp }
    # UnifiProtectDashboard (separate repo/namespace) - same -heim/-public pair as every other
    # service on this Gateway. Backfilled after this repo's initial import from studylife/k8s
    # was found to predate these two listeners (studylife/k8s/07c-gateway.yaml already had them,
    # from PR lukislp/studylife#43) - applying this file wiped them from the live Gateway object
    # (HTTPRoute status: NotAllowedByListeners) until restored live via kubectl patch --type=json
    # and backfilled here. Matches the live object exactly - kubectl diff clean.
    - name: unifidashboard-heim
      hostname: unifidashboard.heim.lan
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - { kind: Secret, name: unifidashboard-tls }
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels: { kubernetes.io/metadata.name: unifiprotectdashboard }
    - name: unifidashboard-public
      hostname: unifidashboard.lukas2311-homelab.com
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - { kind: Secret, name: unifidashboard-tls }
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels: { kubernetes.io/metadata.name: unifiprotectdashboard }
    # homelab-autodoc (separate repo/namespace) - same -heim/-public pair as every other service.
    - name: autodoc-heim
      hostname: autodoc.heim.lan
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - { kind: Secret, name: autodoc-tls }
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels: { kubernetes.io/metadata.name: homelab-autodoc }
    - name: autodoc-public
      hostname: autodoc.lukas2311-homelab.com
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - { kind: Secret, name: autodoc-tls }
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels: { kubernetes.io/metadata.name: homelab-autodoc }
    # claude-queue-platform (separate repo/namespace) - same -heim/-public pair as every
    # other service on this Gateway. Two hostnames (web + a separate API host) because the
    # browser and the local agent talk to the API directly (cookies, WebSocket).
    - name: claudequeue-heim
      hostname: claudequeue.heim.lan
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - { kind: Secret, name: claudequeue-tls }
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels: { kubernetes.io/metadata.name: claude-queue }
    - name: claudequeue-public
      hostname: claudequeue.lukas2311-homelab.com
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - { kind: Secret, name: claudequeue-tls }
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels: { kubernetes.io/metadata.name: claude-queue }
    - name: claudequeue-api-heim
      hostname: claudequeue-api.heim.lan
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - { kind: Secret, name: claudequeue-api-tls }
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels: { kubernetes.io/metadata.name: claude-queue }
    - name: claudequeue-api-public
      hostname: claudequeue-api.lukas2311-homelab.com
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - { kind: Secret, name: claudequeue-api-tls }
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels: { kubernetes.io/metadata.name: claude-queue }
    # studylife-developers (separate repo/namespace) - same -heim/-public pair as every other
    # service on this Gateway. Backend speaks plain HTTP (ASPNETCORE_HTTP_PORTS=8080, no
    # BackendTLSPolicy needed), same as studylife-mcp.
    - name: studylife-developers-heim
      hostname: studylife-developers.heim.lan
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - { kind: Secret, name: studylife-developers-tls }
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels: { kubernetes.io/metadata.name: studylife-developers }
    - name: studylife-developers-public
      hostname: studylife-developers.lukas2311-homelab.com
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - { kind: Secret, name: studylife-developers-tls }
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels: { kubernetes.io/metadata.name: studylife-developers }
