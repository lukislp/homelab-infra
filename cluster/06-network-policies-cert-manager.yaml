# cert-manager namespace: same default-deny ingress strategy as studylife-scale and monitoring
# (05-network-policies-monitoring.yaml). Egress deliberately stays open, same trade-off as
# there - cert-manager legitimately talks to the Kubernetes API, ACME endpoints and the
# Cloudflare API, and an egress allowlist would have to name them all.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: cert-manager
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
# The webhook is called by the kube-apiserver for every cert-manager resource write
# (Validating/MutatingWebhookConfiguration). The apiserver runs as a host process on the
# nodes, so its traffic comes from node IPs that no pod/namespace selector can match -
# the port must accept all sources or every Certificate/Issuer apply times out cluster-wide.
# TLS on the webhook itself is what actually authenticates this hop.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-apiserver-to-webhook
  namespace: cert-manager
spec:
  podSelector: { matchLabels: { app: webhook } }
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - { protocol: TCP, port: 10250 }
---
# Prometheus' "cert-manager" scrape job (homelab-infra/monitoring/01-prometheus.yaml) reads
# the controller's /metrics by pod IP - without this allow, default-deny-ingress above would
# silently break that scrape ("connection refused"), the same failure mode promtail/loki hit
# in the monitoring namespace before their allows existed. Opened for the whole namespace on
# the shared metrics port: all three components expose 9402, and scraping more of them later
# should not need a policy change.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-metrics-scrape
  namespace: cert-manager
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
          podSelector: { matchLabels: { app: prometheus } }
      ports:
        - { protocol: TCP, port: 9402 }
