# Velero: nightly application PVC backups to Cloudflare R2 - the "buy" decision after
# evaluating a self-built scale-down/tar orchestrator (see 00g-velero-backups.md for the
# full trade-off write-up and the restore drill). Installed by hand via helm, like the
# tailscale operator - NOT Flux-managed (no helm-controller in this cluster by design):
#
#   helm repo add vmware-tanzu https://vmware-tanzu.github.io/helm-charts
#   helm upgrade --install velero vmware-tanzu/velero -n velero -f cluster/10-velero-values.yaml
#
# Credentials: the SAME R2 API token CNPG's barman uses (one token = one revocation kills
# every offsite backup at once, deliberately), mirrored into the velero namespace as secret
# "velero-r2-credentials" with the aws-credentials-file format the plugin expects - creation
# and rotation commands in 00g-velero-backups.md.
image:
  repository: velero/velero
  tag: v1.18.1 # arm64 verified via docker manifest inspect before install
initContainers:
  # "AWS" plugin = velero's generic S3-API driver; R2 is S3-compatible. No AWS involved.
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.14.0 # arm64 verified too
    volumeMounts:
      - name: plugins
        mountPath: /target
resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { cpu: 500m, memory: 512Mi }
# The server needs no root (verified live: BSL Available + backup run under this
# context) - same hardening baseline as every app in this cluster.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities: { drop: ["ALL"] }
  seccompProfile: { type: RuntimeDefault }
credentials:
  useSecret: true
  existingSecret: velero-r2-credentials
configuration:
  # The hardening above runs the server as runAsUser 65534 ("nobody", HOME=/nonexistent
  # in the image's passwd). The server itself doesn't care, but the kopia repo
  # MAINTENANCE jobs Velero spawns hourly inherit this env and crash trying to write
  # kopia's config below $HOME ("mkdir /nonexistent: permission denied") - observed
  # live as a steady stream of Error pods, one per BackupRepository. Maintenance
  # jobs inherit the server container's env and mounts, and /scratch is the chart's
  # own emptyDir (world-writable), so pointing HOME there fixes the jobs without
  # loosening any securityContext. Backups themselves were never affected - the
  # actual kopia uploads run in the node-agent - but without maintenance the repos
  # would never prune expired data.
  extraEnvVars:
    - name: HOME
      value: /scratch
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: studylifebackup
      # Own prefix next to barman's cluster folders - restic/kopia data can never collide
      # with the Postgres WAL archive.
      prefix: velero
      config:
        region: auto
        s3ForcePathStyle: "true"
        s3Url: https://44ffca74c2d2f27b33389c8f54f95edf.r2.cloudflarestorage.com
        # R2 rejects the AWS SDK's newer trailer checksums - must be explicitly empty.
        checksumAlgorithm: ""
  # local-path has no CSI snapshot support - file-system backup via the node-agent (kopia,
  # compressed + deduplicated) is the whole point of this setup, volume snapshots stay off.
  volumeSnapshotLocation: []
  defaultBackupStorageLocation: default
  defaultVolumesToFsBackup: false
snapshotsEnabled: false
deployNodeAgent: true
nodeAgent:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
  # Root is the node-agent's job description: kopia file-system backups read
  # every pod's volume files under /var/lib/kubelet/pods (chart default
  # runAsUser 0). Privilege ESCALATION it still doesn't need. No probes: the
  # node-agent exposes no health endpoint and the chart offers no probe
  # fields. Both acknowledged for autodoc's findings engine below.
  containerSecurityContext:
    allowPrivilegeEscalation: false
    seccompProfile: { type: RuntimeDefault }
  annotations:
    autodoc.homelab/accept-run-as-root-allowed: >-
      kopia file-system backups read every pod's volume files under
      /var/lib/kubelet/pods - root by necessity
    autodoc.homelab/accept-missing-probes: >-
      the node-agent exposes no health endpoint and the chart offers no
      probe fields
metrics:
  enabled: true
schedules:
  # Nightly at 03:00 - after the 02:00 autodoc collector push, before Postgres' own 03:00
  # barman run finishes competing for bandwidth is irrelevant at these sizes. 72h TTL
  # (lowered from 168h 2026-09-03, mirroring CNPG's retention going 7d->3d - a week of
  # history wasn't needed, and R2 storage/cost scales with it); Velero prunes expired
  # backups itself.
  nightly-pvc:
    disabled: false
    schedule: "0 3 * * *"
    template:
      ttl: 72h
      includedNamespaces:
        - monitoring
        - homelab-autodoc
        - homelab-hub
        - studylife-ai
        # The two below were MISSING when their pods got their opt-in annotations - an
        # annotation outside includedNamespaces silently does nothing (found in review,
        # verified with a targeted backup afterwards). If another app opts in, its
        # namespace must be added here too.
        - studylife-mcp
        - unifiprotectdashboard
        - claude-queue
      snapshotVolumes: false
      # Volumes join the backup by OPT-IN pod annotation only
      # (backup.velero.io/backup-volumes: <volume-name>, set in each app's own repo) -
      # deliberate: monitoring also holds prometheus' TSDB and loki's log store, which are
      # observability data we accept losing, and an opt-out model would silently swallow
      # every future PVC into the nightly upload.
      defaultVolumesToFsBackup: false
  # Resources-only backup of the hand-curated cluster state nothing else preserves:
  # the sealed-secrets private keys (kube-system - without them every SealedSecret in
  # every repo is undecryptable forever), the studylife-internal-ca key (cert-manager),
  # the surgically-patched studylife-gateway listener list, NginxProxy/ProxyClass/
  # MetalLB config, tailscale operator state, and the flux auth secrets. Kilobytes per
  # night; secrets land in the kopia repo protected exactly as well as the R2 token -
  # the same trust level the CNPG WAL archive already has.
  cluster-state:
    disabled: false
    schedule: "30 3 * * *"
    template:
      ttl: 72h
      includedNamespaces:
        - kube-system
        - cert-manager
        - nginx-gateway
        - metallb-system
        - tailscale
        - flux-system
        # studylife-scale: hand-created secrets (studylife-apns - the Apple push key -,
        # dataprotection keys, the PG app secret, the shared R2 token) plus the CNPG
        # Cluster/Pooler/ScheduledBackup CRs. Volumes stay out (CNPG barman owns the data,
        # redis rebuilds itself); the RESOURCES were backed up nowhere until now.
        - studylife-scale
      includeClusterResources: true
      snapshotVolumes: false
      defaultVolumesToFsBackup: false
