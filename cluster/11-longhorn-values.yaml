# global.tolerations covers the USER-deployed components (longhorn-manager DaemonSet, driver
# deployer, UI). defaultSettings.taintToleration below covers only the SYSTEM-managed ones
# (instance-manager, CSI plugin, engine-image DaemonSet) - and Longhorn applies that setting
# only once every volume is detached (longhorn-manager setting_controller.go:
# "failed to apply ... when there are attached volumes. It will be eventually applied").
# Without this block a helm upgrade rolled the manager off pinode01 (studylife/relief taint)
# and it could not come back, which would strand the 29 replicas living there.
# Rolled out live 2026-09-29 (helm upgrade pinned to chart 1.7.2, all volumes stayed healthy).
global:
  tolerations:
    - key: studylife/relief
      operator: Equal
      value: "true"
      effect: NoSchedule
# Longhorn: distributed, cross-node-replicated block storage - installed alongside
# local-path, NOT replacing it. Installed by hand via helm, like Velero/tailscale - NOT
# Flux-managed (no helm-controller in this cluster by design):
#
#   helm repo add longhorn https://charts.longhorn.io
#   kubectl create namespace longhorn-system
#   helm upgrade --install longhorn longhorn/longhorn -n longhorn-system -f cluster/11-longhorn-values.yaml
#
# Why alongside, not instead of, local-path: most PVCs in this cluster are fine staying
# node-pinned (Postgres already has CNPG's own app-level replication + barman offsite
# backup; Redis/Prometheus/Loki data loss is explicitly accepted, see
# cluster/00g-velero-backups.md). Longhorn is for workloads where a node dying should mean
# a SEAMLESS failover, not a restore-from-backup with the associated downtime/manual step -
# migrated deliberately, one workload at a time, starting with a throwaway test volume to
# prove replication+failover actually works on this hardware before anything real moves.
#
# defaultClass: false - existing/new PVCs keep using local-path unless a workload
# explicitly opts in via storageClassName: longhorn. Never becomes the cluster default.
#
# homelab-autodoc findings: Longhorn's ~20 upstream workloads violate the hardening
# rules (privileged/root containers, no probes/resources/netpols/PDBs, chart-shipped
# configmaps) for one shared architectural reason - a storage engine needs host and
# device access, and the chart exposes no fields to change most of it. They are
# acknowledged NAMESPACE-WIDE via autodoc.homelab/accept-<rule> annotations on the
# longhorn-system Namespace object (autodoc >= 1.50: namespace-level accepts), applied
# by hand like the helm install itself - kubectl describe ns longhorn-system shows the
# nine annotations with their reasons; re-apply them when recreating the namespace.
persistence:
  defaultClass: false
  defaultClassReplicaCount: 2 # not 3 - see defaultSettings.defaultReplicaCount below
defaultSettings:
  # 2-way replication, not the chart's default 3: with exactly 3 nodes, 3 replicas would
  # put a copy on every single node for every volume (no room to ever rebuild a lost
  # replica without first losing a node) and triples write amplification/network traffic on
  # already resource-constrained Pi hardware (see cluster/11-longhorn-values.yaml's own node
  # sizing note below). 2 replicas still survives exactly 1 node loss, which is the only
  # scenario this is being introduced for.
  defaultReplicaCount: 2
  # Off by chart default - left that way until pinode03 joined (2026-08-25). With only 2
  # nodes ever holding replicas at a time, auto-balance had nothing to do; once a 3rd node
  # joined, every volume created before that point stayed pinned to whichever 2 nodes it
  # originally landed on (Longhorn doesn't rebalance existing replicas on its own) - found
  # live via a RAM-pressure investigation on pinode01: 23/23 replicas split across
  # pinode01/02, zero on pinode03, since pinode01/02 predate pinode03 and nothing ever
  # triggered a move. "best-effort" (not "least-effort"/strict) matches
  # defaultReplicaCount: 2 on 3 nodes - it fills the least-utilized node without a rigid disk
  # utilization target, and Longhorn moves replicas gradually (rebuild-then-remove-old, not
  # all at once), so this is safe to enable on already-attached volumes.
  replicaAutoBalance: best-effort
  #
  # WARNING found on 2026-09-14, unresolved: pinode03's Longhorn disk is /var/lib/longhorn on its
  # 57GB ROOT filesystem, which on that node is the SD card (mmcblk0) - pinode01 and pinode02 both
  # offer 229GB. That card is already the cluster's worst bottleneck: under memory pressure it was
  # measured at 94% busy serving 15.6MB/s of page-cache refills, which stalled every health probe
  # on the node. Auto-balance has not actually moved anything in the 20 days since pinode03 joined
  # (storageScheduled there is still 0), but if it ever does, replica write traffic lands on that
  # same card. Either give pinode03 a disk on its USB storage, or set allowScheduling=false on its
  # Longhorn disk, before relying on this setting to spread replicas.

  # storageMinimalAvailablePercentage: the 25% default assumes real server disks. On 2026-09-29
  # pinode02's disk (228Gi, 50Gi free, ~54Gi scheduled) reported Schedulable=False against the
  # default's 57Gi reserve - with pinode03's disk deliberately unschedulable (SD card), that
  # left pinode01 as the ONLY node able to take new replicas. Actual data across the cluster
  # is ~5GB; the free space is eaten by the OS side of the same disk, not by Longhorn. 15%
  # (34Gi reserve) keeps both SSD nodes schedulable and still leaves far more headroom than the
  # volumes need. Set live first (setting applied=true immediately, pinode02 schedulable again),
  # recorded here so the next helm upgrade does not put 25% back.
  storageMinimalAvailablePercentage: 15
  # Both set live during the 1.7.2 -> 1.13.0 upgrade chain on 2026-09-30 and recorded here so a
  # helm upgrade keeps them:
  # - concurrentAutomaticEngineUpgradePerNodeLimit 1: after every manager upgrade Longhorn
  #   live-upgrades the volumes' engine binary on its own (default 0 = never; every volume would
  #   sit on the old engine until someone clicks "Upgrade Engine" per volume). Live upgrade does
  #   NOT move the engine PROCESS - it stays in the old instance-manager pod until the volume is
  #   detached once, so old instance managers linger (one per upgraded minor) until a detach.
  # - guaranteedInstanceManagerCPU 4 (default 12 = 480m per pod on these 4-core Pis): during a
  #   chain of minor upgrades one instance-manager generation per node accumulates per step, and
  #   pinode02 ran out of schedulable CPU at the second step (OutOfcpu on the new instance
  #   manager). 160m is a scheduling reservation only (no CPU limit is set), not a throttle.
  concurrentAutomaticEngineUpgradePerNodeLimit: 1
  guaranteedInstanceManagerCPU: 4
  #
  # pinode01 carries studylife/relief=true:NoSchedule on top of the control-plane taint, and
  # Longhorn's own DaemonSets (longhorn-manager, longhorn-csi-plugin, engine-image-*) ship with
  # no tolerations at all. NoSchedule does not evict, so on 2026-09-14 all three were still
  # running on pinode01 purely because they predate the taint, while the DaemonSets themselves
  # reported desiredNumberScheduled=2. The first rollout of any of them would have deleted the
  # pinode01 pod with no way to recreate it - and every one of the 28 volumes keeps both of its
  # replicas on pinode01 and pinode02, so that single rollout would have dropped all of them to
  # one replica at once. See cluster/00i-probe-timeout-budget.md, "Before rolling any DaemonSet".
  #
  # Longhorn propagates this value to its own components. Per the 1.7 setting reference the
  # change is safe to make while volumes are attached: the components are simply NOT restarted,
  # and the setting reports applied=false until all volumes are detached. It was set live on
  # 2026-09-14 (kubectl -n longhorn-system patch settings.longhorn.io taint-toleration) and is
  # recorded here so a later helm upgrade does not silently drop it again. Detaching every volume
  # to make it take effect still needs its own maintenance window.
  taintToleration: "studylife/relief=true:NoSchedule"

