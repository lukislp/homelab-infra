# velero namespace: same default-deny ingress strategy as the other system
# namespaces. Only real inbound flow: Prometheus scraping the server's :8085
# metrics (the backup-overdue alert depends on it). The node-agent accepts no
# inbound traffic at all; egress (R2, apiserver, kubelet paths) deliberately
# stays open like everywhere else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: velero
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-metrics-scrape
  namespace: velero
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: velero } }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
          podSelector:
            matchLabels: { app: prometheus }
      ports:
        - { protocol: TCP, port: 8085 }
