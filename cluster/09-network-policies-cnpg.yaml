# cnpg-system namespace: same default-deny ingress strategy as cert-manager/metallb.
# The operator receives exactly one kind of inbound traffic: the apiserver calling its
# Validating/MutatingWebhooks (every Cluster/Pooler/ScheduledBackup write) on 9443, from
# node IPs no selector can match - so that port accepts all sources, same reasoning as the
# cert-manager and MetalLB webhook policies. Its :8080 metrics are NOT scraped (Prometheus'
# "cnpg" job reads the Postgres instances in studylife-scale on 9187, not the operator), so
# no scrape allow is needed here. Egress deliberately stays open.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: cnpg-system
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-apiserver-to-webhook
  namespace: cnpg-system
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: cloudnative-pg } }
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - { protocol: TCP, port: 9443 }
