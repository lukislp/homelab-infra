# MetalLB gives "Service type: LoadBalancer" a stable external IP on bare metal (no cloud provider
# that would otherwise assign a real LB IP). Layer 2 mode (ARP-based) instead of BGP,
# because no BGP-capable router should be assumed in the home network - the standard choice for
# homelab clusters. Range below is a small, permanently reserved slice of the real home-network
# subnet (192.168.20.0/24) that is NOT handed out by the DHCP server, to avoid IP conflicts.
#
# INCIDENT (fixed 2026-08-22): this file used to still carry the placeholder range from the local
# Docker Desktop test cluster (172.18.255.200-172.18.255.250, the "kind" Docker network subnet).
# The live pool had since been repointed at the real range below via a manual kubectl
# patch/edit that was never committed back here - re-applying this file during the homelab-infra
# split silently reverted the pool to the placeholder range, which took the whole cluster's
# external IP (and with it every hostname behind studylife-gateway) offline until fixed. Lesson,
# same as 02-gateway.yaml's own incident note: for a file every future `kubectl apply` re-applies
# in full, "leave the unrelated drift alone" isn't actually possible - either the file matches
# live reality or applying it corrupts live reality.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: studylife-pool
  namespace: metallb-system
spec:
  addresses:
    - 192.168.20.240-192.168.20.250
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: studylife-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - studylife-pool
