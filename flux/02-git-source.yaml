# Points Flux at the homelab-infra repo itself (public GitHub repo). Read access only: since
# 2026-09-12 no GitRepository on this cluster carries a token any more - the app repos write
# their released image tags from CI (deploy-bump jobs over their semantic-release deploy keys)
# and Flux only reads. The former studylife-git-auth secret (a personal access token) is gone.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: homelab-infra
  namespace: flux-system
spec:
  interval: 5m
  url: https://github.com/lukislp/homelab-infra.git
  ref:
    branch: main
