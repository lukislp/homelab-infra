# Reads container logs per node (/var/log/pods hostPath) and ships them with Kubernetes
# metadata (namespace/pod/container labels) to Loki - DaemonSet, one pod per node, automatic.
#
# INCIDENT: this file (and k8s/18-loki.yaml) existed in git for a while but was never
# successfully deployed. First real deploy attempt found two separate root causes:
#
#   1. The original kubernetes_sd_configs-based scrape_configs below (role: pod, relabeling
#      __meta_kubernetes_pod_uid into a glob __path__) never produced a single target -
#      promtail_targets_active_total stayed 0 indefinitely, log output stopped dead after
#      "Starting provider" with no further discovery/error messages even at debug log level.
#      Confirmed NOT an RBAC/TLS/network problem: raw LIST/WATCH calls against the API server
#      using the exact same ServiceAccount token succeeded instantly and correctly (both with
#      and without certificate validation). Root cause not fully identified - looks like a
#      genuine bug/incompatibility between this Promtail version's Kubernetes SD client and
#      this specific K3s API server, not a configuration mistake. Worked around rather than
#      chased further: this file now extracts namespace/pod/container straight from the
#      hostPath file structure via a pipeline_stages regex instead of calling the Kubernetes
#      API at all - sidesteps the bug entirely and needs no cluster RBAC whatsoever (the
#      ServiceAccount/ClusterRole/ClusterRoleBinding this file used to define are gone).
#   2. Separately, the "monitoring" namespace's default-deny-ingress NetworkPolicy had no
#      matching "allow-ingress-to-loki" rule (every other service in that namespace has its
#      own) - pushes to Loki failed with "connection refused" regardless of the above. Fixed
#      in this repo's own k8s/12-network-policies.yaml (allow-ingress-to-loki).
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: monitoring
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
    positions:
      filename: /run/promtail/positions.yaml
    clients:
      - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push
    scrape_configs:
      - job_name: kubernetes-pods
        static_configs:
          - targets: ["localhost"]
            labels:
              job: kubernetes-pods
              __path__: /var/log/pods/*/*/*.log
        pipeline_stages:
          # Real directory structure per node: /var/log/pods/<namespace>_<pod>_<uid>/<container>/N.log
          # (verified live) - Promtail auto-populates the "filename" field with the actual
          # matched path for every discovered file, so this needs no Kubernetes API calls at
          # all to recover the same namespace/pod/container labels the SD-based approach
          # above was meant to produce.
          - regex:
              source: filename
              expression: '^/var/log/pods/(?P<namespace>[^_]+)_(?P<pod>.+)_[a-f0-9-]+/(?P<container>[^/]+)/\d+\.log$'
          - labels:
              namespace:
              pod:
              container:
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: monitoring
  annotations:
    # Read by homelab-autodoc's findings engine: acknowledges the root
    # finding with its reason instead of leaving it listed as open.
    autodoc.homelab/accept-run-as-root-allowed: >-
      tails every pod's logs under /var/log/pods, which the kubelet
      writes root-readable only
spec:
  selector:
    matchLabels: { app: promtail }
  template:
    metadata:
      labels: { app: promtail }
    spec:
      # No Kubernetes API access needed at all now (see the incident note above) - was
      # "promtail" (a dedicated ServiceAccount/ClusterRole/ClusterRoleBinding, now removed)
      # back when kubernetes_sd_configs required list/watch on pods/nodes.
      automountServiceAccountToken: false
      tolerations:
        # This DaemonSet must run on EVERY node including the control-plane Pi - a node
        # whose logs nothing ships is a blind spot, not a saved resource.
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
        - key: node-role.kubernetes.io/master
          operator: Exists
        # pinode01 additionally carries studylife/relief:NoSchedule (keeps app workloads off
        # the control-plane node after the 2026-09 Longhorn rebalance). A NoSchedule taint
        # does not evict, so the pod that was already running there survived it unnoticed -
        # until the first rollout of this DaemonSet, which silently dropped pinode01 from 3
        # nodes to 2. Same toleration piwatch's node-agent already carries, for the same
        # reason: a monitoring agent is not an app workload.
        - key: studylife/relief
          operator: Exists
      containers:
        - name: promtail
          # Pinned by the multi-arch index digest (arm64 entry verified) on top of the
          # readable tag: the tag alone still resolves through a mutable registry pointer, the
          # digest is what containerd actually pulls. Renovate keeps tag and digest in step.
          # 3.6.11 is the LAST promtail release that exists - promtail reached end of life on
          # 2026-03-02 and was removed from the Loki repo with Loki 3.7.3, so the server next
          # door (08-loki.yaml) goes on to 3.7.x while this agent stops here. The push API it
          # speaks is unchanged, so 3.6.11 still ships into a 3.7.7 Loki, but it will never
          # receive another fix of any kind, security included.
          # Deliberately a concrete version and not :3.6 or :latest - both of those tags are
          # OLDER than 3.6.11 upstream and were never moved again after promtail was frozen.
          # The replacement is Grafana Alloy, which can read this promtail.yaml as-is or
          # convert it with "alloy convert --source-format=promtail". That is a real migration
          # with its own rollout, deliberately not bundled into an image bump.
          image: grafana/promtail:3.6.11@sha256:a761cb834cfaeee29745440d4884d6748f0a08d8f68928db1d707018c1dcfbe9
          args: ["-config.file=/etc/promtail/promtail.yaml"]
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 100m, memory: 128Mi }
          # Root is required here - /var/log/pods on the host is only readable
          # by root, so runAsNonRoot is not an option (the one accepted
          # run-as-root finding in this namespace). Everything else is still
          # dropped.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          livenessProbe:
            httpGet: { path: /ready, port: 9080 }
            initialDelaySeconds: 15
            periodSeconds: 15
            # timeoutSeconds/failureThreshold raised deliberately (2026-09-13): with the
            # Kubernetes default timeoutSeconds: 1 these probes were the single biggest
            # restart trigger in this cluster. pinode03 is a 4 GB arm64 node that runs with
            # well under 1 GB available and swap in use; during a load spike an HTTP probe
            # routinely needs longer than one second to answer, kubelet counts that as a
            # failure and kills a perfectly healthy container. At 1 s the probe measures node
            # load, not process health - 5 s plus a wider failure window restores it as a
            # health signal. Probe path/port/type are deliberately unchanged.
            # failureThreshold 5 (not 3) because this is one of the monitoring DaemonSets:
            # they are the noisiest probe-timeout offenders and the least critical thing in
            # the cluster - a stale exporter costs a scrape gap, a restart loop costs real
            # CPU on the node that is already the bottleneck.
            # promtail alone accounts for the most probe-timeout events cluster-wide, and a
            # restarting log shipper is strictly worse than a slow one (it resumes from its
            # positions file instead of streaming).
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet: { path: /ready, port: 9080 }
            initialDelaySeconds: 5
            periodSeconds: 10
            # Same reasoning as the liveness probe above.
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - { name: config, mountPath: /etc/promtail }
            - { name: pods-logs, mountPath: /var/log/pods, readOnly: true }
            - { name: positions, mountPath: /run/promtail }
      volumes:
        - { name: config, configMap: { name: promtail-config } }
        - { name: pods-logs, hostPath: { path: /var/log/pods } }
        - { name: positions, hostPath: { path: /run/promtail, type: DirectoryOrCreate } }
