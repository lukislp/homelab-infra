# HISTORICAL, no longer applicable (corrected 2026-09-13): this file used to carry placeholder
# hostnames ("grafana.example.invalid"/"grafana-public.example.invalid") in an Ingress that only
# bootstrap-cluster.ps1's -GrafanaHost/-GrafanaPublicHost parameters substituted at apply time, so
# a direct "kubectl apply -f" overwrote the real hostnames in the Ingress AND - via cert-manager's
# ingress-shim - in the certificate, which made Grafana unreachable for everyone until it was
# patched back live. That hazard is gone: routing moved to the Gateway API and the Grafana
# hostnames now live in cluster/02-gateway.yaml as an HTTPRoute. This file no longer contains an
# Ingress, no "example.invalid" string, and no placeholder of any kind - bootstrap-cluster.ps1
# still documents -GrafanaHost as a parameter but no longer substitutes anything into it.
# A plain "kubectl apply -f monitoring/04-grafana.yaml" is safe again. Run "kubectl diff -f"
# first anyway, the way every manual apply in this repo should.
#
# Self-hosted Grafana instead of Grafana Cloud (no external account needed). Provisioning via
# ConfigMap (Grafana automatically reads /etc/grafana/provisioning/{datasources,dashboards} on
# startup) - the datasource is thus available immediately, without manual clicking. The
# dashboard contents themselves deliberately live in the SEPARATE k8s/17b-grafana-dashboards.yaml
# (see the comment there) - this file now contains only infrastructure (including the ingress
# host placeholders that bootstrap-cluster.ps1 resolves).
#
# Backend TLS for the ingress-nginx -> Grafana hop: leaf certificate from the same
# cluster-internal CA as the external ingress certificate (k8s/07b-cert-manager-issuers.yaml).
# Unlike Kestrel (k8s/04-web.yaml), Grafana can't offer HTTPS on a second port in addition to
# HTTP - GF_SERVER_PROTOCOL switches the SINGLE port 3000 entirely to HTTPS (see the deployment
# below), so the readiness probe and ingress backend protocol are switched along with it.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana-backend-tls
  namespace: monitoring
spec:
  secretName: grafana-backend-tls
  dnsNames:
    - grafana.monitoring.svc.cluster.local
    - grafana
  issuerRef:
    name: studylife-internal-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      # Explicit, fixed UIDs instead of the otherwise randomly generated ones per Grafana
      # instance - so dashboard JSONs (e.g. k8s/17c-grafana-community-dashboards.yaml) can
      # reference "prometheus"/"loki" as fixed values, identical regardless of environment
      # (test cluster AND prod).
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.monitoring.svc.cluster.local:9090
        isDefault: true
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.monitoring.svc.cluster.local:3100
        jsonData:
          # Log-to-trace: turns a matched trace ID inside a log line (Explore) into a jump-off
          # link into the Tempo datasource below. Two entries because the .NET OTel logging
          # exporter and ad-hoc app log lines don't agree on a single field name - "TraceId"
          # (Microsoft.Extensions.Logging/W3C convention) and "trace_id" (OTel semantic
          # conventions) are both matched, whichever appears first in a given line.
          # $$ instead of $ is deliberate (not a typo): Grafana does env-var expansion on this
          # provisioning YAML itself, so a literal "$" has to be escaped as "$$" to survive
          # into the resulting datasource JSON as Grafana's own "${__value.raw}" field syntax.
          derivedFields:
            - datasourceUid: tempo
              matcherRegex: "TraceId[=: ]+([0-9a-f]{32})"
              name: TraceId
              url: "$${__value.raw}"
              urlDisplayLabel: View Trace
            - datasourceUid: tempo
              matcherRegex: "trace_id[=: ]+([0-9a-f]{32})"
              name: trace_id
              url: "$${__value.raw}"
              urlDisplayLabel: View Trace
      # StudyLife telemetry rollout phase 4: trace storage (monitoring/12-tempo.yaml), fed by
      # the OTLP collector (monitoring/11-otel-collector.yaml). Query API only (port 3200) -
      # Grafana never talks OTLP to Tempo, only the collector does.
      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo.monitoring.svc.cluster.local:3200
        jsonData:
          # Trace-to-log: jump from a span in the Tempo trace view back to the matching Loki
          # log lines, correlated by the "pod"/"namespace" labels promtail already attaches to
          # every log line (monitoring/09-promtail.yaml) - not by trace ID, since not every log
          # line carries one. tracesToLogsV2 is the current field; the older "tracesToLogs" key
          # it replaced is intentionally not also set (Grafana 11 reads v2 exclusively).
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: "-5m"
            spanEndTimeShift: "5m"
            tags:
              - { key: pod, value: pod }
              - { key: namespace, value: namespace }
            filterByTraceID: false
            filterBySpanID: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: monitoring
spec:
  accessModes: ["ReadWriteOnce"]
  # Longhorn (cross-node-replicated, cluster/11-longhorn-values.yaml) instead of local-path -
  # grafana.db (dashboards/datasources are re-provisioned from git either way, but the manually-
  # configured Telegram contact point and notification policy aren't) survives a node dying
  # instead of needing a Velero restore. Recreate strategy below, so no RWX concurrent-mount
  # trick needed here.
  storageClassName: longhorn
  resources:
    requests: { storage: 1Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: grafana }
  template:
    metadata:
      labels: { app: grafana }
      annotations:
        # Velero nightly PVC backup: dashboards/datasources are provisioned from Git, but
        # grafana.db also holds the manually-configured Telegram contact point and the
        # notification policy - the two things a rebuild can't reproduce. No consistent-copy
        # pre-hook here (the grafana image ships no sqlite3 CLI); accepted: 7 independent
        # nightly states, worst case is falling back one night (00g-velero-backups.md).
        backup.velero.io/backup-volumes: data
    spec:
      # Grafana's image runs as UID 472 and needs write access to its own data directory - a
      # fresh PVC otherwise belongs to root, which the grafana user can't write to.
      securityContext:
        fsGroup: 472
      # Grafana doesn't need Kubernetes API access (datasources are Prometheus/static).
      automountServiceAccountToken: false
      containers:
        - name: grafana
          # Pinned by the multi-arch index digest (arm64 entry verified) on top of the
          # readable tag: the tag alone still resolves through a mutable registry pointer, the
          # digest is what containerd actually pulls. Renovate keeps tag and digest in step.
          # 11.6.16 -> 13.2.0, taking both irreversible hops at once: 11->12 rewrites the
          # annotation table, 12->13 moves folders and dashboards into unified storage.
          # Upstream supports no downgrade from either, so reverting this commit does NOT undo
          # the migration - the only rollback is restoring a copy of grafana.db. Take a fresh one
          # before applying: the nightly Velero run covers this PVC (see the backup.velero.io
          # annotation above) but is up to 24h old, and what lives only in grafana.db is the
          # manually-configured Telegram contact point, the notification policy and the admin
          # password. Everything else re-provisions from Git. Taken now because 11.x reached end
          # of support on 2026-06-25 and gets no further security patches.
          # The dashboard side was cleared first in its own change: npm-official.json was the only
          # dashboard in this repo carrying Angular panel types (dropped in Grafana 12) and it was
          # redundant with npm.json - see 06-grafana-community-dashboards.yaml. The provisioning
          # formats are unaffected: datasources, dashboard provider and alerting are all
          # apiVersion 1, which 13 still reads, and only core datasources (prometheus/loki/tempo)
          # are in use, no plugins to go stale.
          image: grafana/grafana:13.2.0@sha256:3fd54ae1214669f8355f065ec9f6445d5279a3d77095ab048ca045685272429b
          env:
            # GF_SERVER_* is Grafana's standard way to set any grafana.ini setting via an env
            # var (GF_<SECTION>_<KEY>) - no separate grafana.ini ConfigMap mount needed.
            - { name: GF_SERVER_PROTOCOL, value: https }
            - { name: GF_SERVER_CERT_FILE, value: /etc/grafana-backend-tls/tls.crt }
            - { name: GF_SERVER_CERT_KEY, value: /etc/grafana-backend-tls/tls.key }
            # Go only sizes its heap against the machine's memory unless told otherwise, so without this
            # the garbage collector has no idea a 768Mi cgroup ceiling exists - it grows to roughly twice
            # the live heap and the kernel OOM-kills the container before a collection ever runs. Set to
            # 640MiB, a soft target the runtime collects harder to stay under, leaving 128Mi of hard
            # headroom above it. Measured peak on 13.2.0 during the first start (plugin extraction plus
            # the unified-storage migration) was 449Mi RSS, settling to ~360Mi, so 640MiB is well clear of
            # steady state and will not cause GC thrashing.
            - { name: GOMEMLIMIT, value: 640MiB }
          ports:
            - containerPort: 3000
          resources:
            # Raised 256Mi -> 768Mi across the 13.x jump. Live usage on 11.6.16 was 107Mi, but 13
            # carries a higher baseline and runs the unified-storage migration against this PVC on
            # its first start, a one-off cost on top. 256Mi left roughly 150Mi of headroom for both,
            # the same thin margin that has OOMKilled prometheus twice in this cluster. 512Mi is a
            # ceiling, not a reservation - the request stays at 128Mi. Revisit once 13.x steady state
            # has been measured for a few days.
            # Second correction after the rollout: 512Mi was not enough of a ceiling. The first start
            # peaked at 449Mi RSS with only 54Mi of that reclaimable cache, i.e. 88% of the limit, and Go
            # had no GOMEMLIMIT to collect against. 768Mi plus the soft limit above turns that from an
            # OOM waiting for a heavy query into a bounded, self-correcting workload.
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 300m, memory: 768Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/grafana }
            - { name: datasources, mountPath: /etc/grafana/provisioning/datasources }
            - { name: dashboard-provider, mountPath: /etc/grafana/provisioning/dashboards }
            # ENTIRE ConfigMaps mounted as a directory (no subPath) - every key in them
            # automatically becomes a file. A new/changed dashboard therefore only needs a
            # commit in k8s/17b or 17c (Flux rolls it out automatically), NEVER a change here
            # again - see the comment in k8s/17b-grafana-dashboards.yaml.
            - { name: dashboard-core, mountPath: /etc/grafana/provisioning/dashboard-json/core }
            - { name: dashboard-community, mountPath: /etc/grafana/provisioning/dashboard-json/community }
            - { name: dashboard-studylife-ai, mountPath: /etc/grafana/provisioning/dashboard-json/studylife-ai }
            - { name: dashboard-studylife-mcp, mountPath: /etc/grafana/provisioning/dashboard-json/studylife-mcp }
            - { name: alerting, mountPath: /etc/grafana/provisioning/alerting }
            - { name: backend-tls, mountPath: /etc/grafana-backend-tls, readOnly: true }
          # Declares what the image already does (runs as grafana/472) so the
          # posture is enforced, not incidental - no data-ownership migration
          # needed, the PVC files were always written by this UID.
          securityContext:
            runAsNonRoot: true
            runAsUser: 472
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          livenessProbe:
            httpGet: { path: /api/health, port: 3000, scheme: HTTPS }
            initialDelaySeconds: 30
            periodSeconds: 15
            # timeoutSeconds/failureThreshold raised deliberately (2026-09-13): with the
            # Kubernetes default timeoutSeconds: 1 these probes were the single biggest
            # restart trigger in this cluster. pinode03 is a 4 GB arm64 node that runs with
            # well under 1 GB available and swap in use; during a load spike an HTTP probe
            # routinely needs longer than one second to answer, kubelet counts that as a
            # failure and kills a perfectly healthy container. At 1 s the probe measures node
            # load, not process health - 5 s plus a wider failure window restores it as a
            # health signal. Probe path/port/type are deliberately unchanged.
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /api/health, port: 3000, scheme: HTTPS }
            initialDelaySeconds: 10
            periodSeconds: 5
            # Same reasoning as the liveness probe above.
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: grafana-data } }
        - { name: datasources, configMap: { name: grafana-datasources } }
        - { name: dashboard-provider, configMap: { name: grafana-dashboard-provider } }
        - { name: dashboard-core, configMap: { name: grafana-dashboard-core } }
        - { name: dashboard-community, configMap: { name: grafana-dashboard-community } }
        - { name: dashboard-studylife-ai, configMap: { name: grafana-dashboard-studylife-ai } }
        - { name: dashboard-studylife-mcp, configMap: { name: grafana-dashboard-studylife-mcp } }
        - { name: alerting, configMap: { name: grafana-alerting } }
        - { name: backend-tls, secret: { secretName: grafana-backend-tls } }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  selector: { app: grafana }
  ports:
    - port: 80
      targetPort: 3000
# Ingress object removed (ingress-nginx decommissioned, see docs/SCALING.md "Migration to
# NGINX Gateway Fabric completed") - routing now runs exclusively via the HTTPRoute in
# k8s/07d-httproutes.yaml.
