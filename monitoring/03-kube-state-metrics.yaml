# K8s object state (pod restarts, replica availability, PVC usage) - the rest of the
# cluster overview dashboard, makes it visible e.g. WHETHER the anti-affinity from an earlier
# round actually distributes across nodes.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-state-metrics
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "services", "persistentvolumeclaims", "namespaces"]
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["list", "watch"]
  # Added for the autodoc-collector staleness alert (07-grafana-alerting.yaml):
  # kube_job_status_completion_time is the only signal for "the nightly collector push
  # succeeded recently" - jobs/cronjobs were not in the restricted list before.
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["list", "watch"]
  # v2.18.0+ watches EndpointSlice instead of the deprecated v1 Endpoints API by default
  # (kube_endpoint_* metrics never used by any dashboard here, so nothing else to update) -
  # "endpoints" removed above, this replaces it.
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels: { app: kube-state-metrics }
  template:
    metadata:
      labels: { app: kube-state-metrics }
    spec:
      serviceAccountName: kube-state-metrics
      containers:
        - name: kube-state-metrics
          # Pinned by the multi-arch index digest (arm64 entry verified) on top of the
          # readable tag: the tag alone still resolves through a mutable registry pointer, the
          # digest is what containerd actually pulls. Renovate keeps tag and digest in step.
          # v2.18.0 -> v2.20.0: two minor bumps, same major. v2.20.0 adds four
          # admissionregistration.k8s.io resources (mutating/validating admission policies and
          # their bindings) to its DEFAULT resource list, which would have meant a wall of
          # "forbidden" errors against the restricted ClusterRole above - the explicit
          # --resources list below already makes that a non-event, same as it did for v2.18.0.
          # The other v2.20.0 change to watch for, kube_pod_status_reason becoming sparse
          # (no more value-0 series for reasons that are not set), affects nothing here: that
          # metric is not referenced by any dashboard or alert rule in this repo.
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0@sha256:42cfe3723a5f058171c627537fb57a3ea0f26e4380fa18555a95cb1a1b4cfc5b
          # v2.18.0 defaults to watching many more resource types than v2.13.0 did (CSRs,
          # Leases, ResourceQuotas, admission webhooks, CronJobs, HPAs, NetworkPolicies,
          # StorageClasses, ...), none of which this cluster's RBAC above grants - found live
          # as a wall of "Failed to watch: forbidden" errors right after the upgrade.
          # Explicitly restricting --resources to exactly what's actually used (matches the
          # RBAC rules above 1:1) instead of widening RBAC to cluster-wide visibility into
          # CSRs/webhooks/etc. that nothing here needs.
          args:
            - --resources=pods,nodes,services,persistentvolumeclaims,namespaces,deployments,replicasets,statefulsets,daemonsets,poddisruptionbudgets,endpointslices,jobs,cronjobs
          ports:
            - containerPort: 8080
            - containerPort: 8081 # telemetry (self-health, serves /readyz)
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
          # Declares what the image already does (runs as nobody/65534) so the
          # posture is enforced, not incidental - no data-ownership migration
          # needed, the PVC files were always written by this UID.
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          livenessProbe:
            httpGet: { path: /livez, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 15
            # timeoutSeconds/failureThreshold raised deliberately (2026-09-13): with the
            # Kubernetes default timeoutSeconds: 1 these probes were the single biggest
            # restart trigger in this cluster. pinode03 is a 4 GB arm64 node that runs with
            # well under 1 GB available and swap in use; during a load spike an HTTP probe
            # routinely needs longer than one second to answer, kubelet counts that as a
            # failure and kills a perfectly healthy container. At 1 s the probe measures node
            # load, not process health - 5 s plus a wider failure window restores it as a
            # health signal. Probe path/port/type are deliberately unchanged.
            # failureThreshold 5 (not 3) - same reasoning as the monitoring DaemonSets:
            # pure metrics plumbing, a scrape gap is far cheaper than a restart loop. This
            # workload had the highest restart count in the namespace.
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet: { path: /readyz, port: 8081 }
            initialDelaySeconds: 5
            periodSeconds: 10
            # Same reasoning as the liveness probe above.
            timeoutSeconds: 5
            failureThreshold: 5
