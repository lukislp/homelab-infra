# Moved here from studylife/k8s/09-uptime-kuma.yaml as part of the cluster-wide-infra split -
# Uptime Kuma monitors HTTP/TCP endpoints across the WHOLE cluster (studylife-web, grafana,
# piwatch, other apps' hostnames - see each app's own monitor config in its UI), not just
# studylife, so it belongs with the rest of the shared monitoring stack rather than in any single
# app's namespace. Namespace changed studylife-scale -> monitoring to match every other
# monitoring-stack object; PVC data was migrated (tar backup/restore of /app/data, verified byte
# counts match) rather than recreated, so all existing monitors/history/settings carried over.
#
# Lightweight outage notification, independent of the metrics pipeline (Grafana/Prometheus) -
# pure HTTP healthcheck monitoring + push/email/webhook on outage. Needs NO external account, so
# it's usable standalone.
#
# Backend TLS: Uptime Kuma natively supports its own TLS via UPTIME_KUMA_SSL_KEY/
# UPTIME_KUMA_SSL_CERT (no reverse-proxy sidecar needed, see
# https://github.com/louislam/uptime-kuma/wiki/Environment-Variables) - this switches the single
# port 3001 entirely to HTTPS, so the readiness probe and Gateway backend protocol are switched
# along with it.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: uptime-kuma-backend-tls
  namespace: monitoring
spec:
  secretName: uptime-kuma-backend-tls
  dnsNames:
    - uptime-kuma.monitoring.svc.cluster.local
    - uptime-kuma
  issuerRef:
    name: studylife-internal-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uptime-kuma-data
  namespace: monitoring
spec:
  accessModes: ["ReadWriteOnce"]
  # Longhorn (cross-node-replicated, cluster/11-longhorn-values.yaml) instead of local-path -
  # kuma.db (monitors/history/settings) survives a node dying instead of needing a Velero
  # restore.
  storageClassName: longhorn
  resources:
    requests: { storage: 512Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma
  namespace: monitoring
spec:
  replicas: 1 # deliberately just 1 - pure observer, no app user data, no HA need
  strategy:
    type: Recreate # single instance with an RWO volume, like Postgres before the CNPG switch
  selector:
    matchLabels: { app: uptime-kuma }
  template:
    metadata:
      labels: { app: uptime-kuma }
      annotations:
        # Velero nightly PVC backup (cluster/10-velero-values.yaml): opt-in for the data
        # volume, plus a pre-hook that writes a consistent SQLite snapshot INTO the volume
        # right before the file-system backup - kuma.db is in WAL mode and written
        # constantly, so the raw file alone could be torn mid-write. Restore preference:
        # kuma.db.velero-snapshot (see 00g-velero-backups.md).
        backup.velero.io/backup-volumes: data
        pre.hook.backup.velero.io/command: '["sqlite3", "/app/data/kuma.db", ".backup ''/app/data/kuma.db.velero-snapshot''"]'
        pre.hook.backup.velero.io/timeout: 60s
    spec:
      # Uptime Kuma doesn't need Kubernetes API access (only checks HTTP/TCP endpoints).
      automountServiceAccountToken: false
      initContainers:
        # The PVC's data was written by the image's root era; chown on every
        # start (idempotent, a single SQLite db) so the non-root app below
        # can keep writing it - same migration pattern as autodoc-server.
        - name: fix-data-ownership
          # Pinned by the multi-arch index digest (arm64 entry verified) on top of the
          # readable tag; 1.36.1 -> 1.38.0 is a minor bump within the same major.
          image: busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
          command: ["chown", "-R", "1000:1000", "/app/data"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /app/data
      containers:
        - name: uptime-kuma
          # Was the floating tag ":2", i.e. whatever the 2.x line happened to point at when a
          # node last pulled - three nodes could legitimately have been running three
          # different versions, and an upstream release could land here unannounced on any
          # pod reschedule. Now a concrete version pinned by the multi-arch index digest
          # (arm64 entry verified). The live pod was serving 2.5.3, so this is one patch
          # release forward, not a jump.
          # Direction matters for this one: uptime-kuma's SQLite migrations are forward-only
          # (rollbackLatestPatch() is an empty stub upstream), so a downgrade boots old code
          # against a newer schema. 2.5.0 changed analytics_type from an enum to a string,
          # which makes anything below 2.5.x a genuinely unsafe target. Restore the Velero
          # snapshot of /app/data rather than pinning backwards.
          image: louislam/uptime-kuma:2.5.5@sha256:c74379ac4509ce2d2c2633f509e67003ee2e45b6e995c5e43fc101f45a0e1fbe
          env:
            - { name: UPTIME_KUMA_SSL_KEY, value: /etc/uptime-kuma-backend-tls/tls.key }
            - { name: UPTIME_KUMA_SSL_CERT, value: /etc/uptime-kuma-backend-tls/tls.crt }
            # v2.3.0+ on Raspberry Pi: SQLite locking issues are possible, officially recommended
            # workaround per the upstream wiki (https://github.com/louislam/uptime-kuma/wiki/Docker-Tags).
            - { name: UPTIME_KUMA_SQLITE_SINGLE_CONNECTION, value: "true" }
          ports:
            - containerPort: 3001
          resources:
            requests: { cpu: 50m, memory: 100Mi }
            limits: { cpu: 200m, memory: 200Mi }
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: backend-tls
              mountPath: /etc/uptime-kuma-backend-tls
              readOnly: true
          # The image defaults to root but the app is a plain Node process -
          # it runs fine as any UID once /app/data belongs to it (see the
          # initContainer above).
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          livenessProbe:
            httpGet: { path: /, port: 3001, scheme: HTTPS }
            initialDelaySeconds: 30
            periodSeconds: 15
            # timeoutSeconds/failureThreshold raised deliberately (2026-09-13): with the
            # Kubernetes default timeoutSeconds: 1 these probes were the single biggest
            # restart trigger in this cluster. pinode03 is a 4 GB arm64 node that runs with
            # well under 1 GB available and swap in use; during a load spike an HTTP probe
            # routinely needs longer than one second to answer, kubelet counts that as a
            # failure and kills a perfectly healthy container. At 1 s the probe measures node
            # load, not process health - 5 s plus a wider failure window restores it as a
            # health signal. Probe path/port/type are deliberately unchanged.
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /, port: 3001, scheme: HTTPS }
            initialDelaySeconds: 10
            periodSeconds: 10
            # Same reasoning as the liveness probe above.
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: uptime-kuma-data }
        - name: backend-tls
          secret: { secretName: uptime-kuma-backend-tls }
---
apiVersion: v1
kind: Service
metadata:
  name: uptime-kuma
  namespace: monitoring
spec:
  selector: { app: uptime-kuma }
  ports:
    - port: 80
      targetPort: 3001
