# Grafana-native alerting instead of a separate Alertmanager - Grafana is already here, file
# provisioning works exactly like for the dashboards (ConfigMap, no manual UI click needed for
# rules/routing), no additional cluster component needed.
#
# THE TELEGRAM CONTACT POINT ITSELF is deliberately NOT provisioned here (unlike originally
# attempted) - Grafana's file provisioning has a real bug/limitation: the "$VARIABLE"
# substitution for secrets in provisioning YAML incorrectly converts purely numeric values
# (Telegram chat IDs are ALWAYS numeric) into a number during the internal JSON roundtrip, even
# though the YAML field is quoted ("cannot unmarshal number into Go struct field Config.chatid
# of type string") - reproduced live multiple times, even with realistic multi-digit IDs, not
# just with "0". A broken contact point makes Grafana crash IMMEDIATELY on startup
# (CrashLoopBackOff), so this is not a cosmetic problem.
#
# INSTEAD: set up the Telegram contact point AND the default notification policy manually once
# in the Grafana UI (exactly like the initial Uptime Kuma setup, see k8s/09-uptime-kuma.yaml) -
# two steps:
#   1. Alerting -> Contact points -> New contact point -> Integration "Telegram" -> enter Bot
#      Token + Chat ID -> use the name "telegram" EXACTLY. Create the bot via @BotFather
#      (provides the token), determine your own chat ID e.g. via @userinfobot.
#   2. Alerting -> Notification policies -> Default policy -> Edit -> switch "Default contact
#      point" to "telegram" -> Save.
# Found live (2nd bug in the same area): a provisioned notification-policies.yaml that
# references "telegram" also makes Grafana crash on startup, AS LONG AS the contact point
# doesn't exist yet ("receiver 'telegram' does not exist") - so routing deliberately also
# remains a manual step instead of file provisioning, until the contact point exists.
#
# All alert rules exclusively use metrics already verified live from the existing dashboards
# (k8s/17b/17c) - no newly invented thresholds without basis. They already fire now (visible
# under Alerting -> Alert rules), only the notification is still missing.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting
  namespace: monitoring
data:
  rules.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: studylife-critical
        folder: StudyLife Alerts
        interval: 1m
        rules:
          - uid: alert-web-down
            title: "Web app unreachable"
            condition: C
            for: 2m
            data:
              - refId: A
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: prometheus
                model: { refId: A, expr: 'min(kube_deployment_status_replicas_available{namespace="studylife-scale",deployment="studylife-web"}) or vector(0)' }
              - refId: B
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: "__expr__"
                model: { refId: B, type: reduce, expression: A, reducer: last }
              - refId: C
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: "__expr__"
                model: { refId: C, type: threshold, expression: B, conditions: [{ evaluator: { type: lt, params: [1] } }] }
            labels: { severity: critical }
            annotations: { summary: "All studylife-web pods are down - the app is unreachable for users." }
          - uid: alert-worker-down
            title: "Worker not active (reminder/report tick not running)"
            condition: C
            for: 2m
            data:
              - refId: A
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: prometheus
                model: { refId: A, expr: 'min(kube_deployment_status_replicas_available{namespace="studylife-scale",deployment="studylife-worker"}) or vector(0)' }
              - refId: B
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: "__expr__"
                model: { refId: B, type: reduce, expression: A, reducer: last }
              - refId: C
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: "__expr__"
                model: { refId: C, type: threshold, expression: B, conditions: [{ evaluator: { type: lt, params: [1] } }] }
            labels: { severity: warning }
            annotations: { summary: "No studylife-worker pod is running - reminders and reports are not being generated." }
          - uid: alert-cnpg-degraded
            title: "Database cluster degraded (fewer than 2 of 3 CNPG instances online)"
            condition: C
            for: 3m
            data:
              - refId: A
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: prometheus
                model: { refId: A, expr: 'count(up{job="cnpg"} == 1) or vector(0)' }
              - refId: B
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: "__expr__"
                model: { refId: B, type: reduce, expression: A, reducer: last }
              - refId: C
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: "__expr__"
                model: { refId: C, type: threshold, expression: B, conditions: [{ evaluator: { type: lt, params: [2] } }] }
            labels: { severity: critical }
            annotations: { summary: "Fewer than 2 CNPG instances online - one more failure means downtime." }
          - uid: alert-redis-degraded
            title: "Redis cluster degraded (fewer than 5 of 6 nodes online)"
            condition: C
            for: 3m
            data:
              - refId: A
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: prometheus
                model: { refId: A, expr: 'count(up{job="redis"} == 1) or vector(0)' }
              - refId: B
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: "__expr__"
                model: { refId: B, type: reduce, expression: A, reducer: last }
              - refId: C
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: "__expr__"
                model: { refId: C, type: threshold, expression: B, conditions: [{ evaluator: { type: lt, params: [5] } }] }
            labels: { severity: warning }
            annotations: { summary: "Fewer than 5 Redis nodes online - cache redundancy is reduced." }
          - uid: alert-ingress-down
            title: "No NGINX Gateway Fabric data plane online"
            condition: C
            for: 2m
            data:
              - refId: A
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: prometheus
                # component=studylife-gateway-nginx is the actual data plane (serves traffic) -
                # component=nginx-gateway is only the control plane, whose failure doesn't
                # immediately interrupt existing connections, see k8s/14-prometheus.yaml.
                model: { refId: A, expr: 'count(up{job="nginx-gateway-fabric",component="studylife-gateway-nginx"} == 1) or vector(0)' }
              - refId: B
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: "__expr__"
                model: { refId: B, type: reduce, expression: A, reducer: last }
              - refId: C
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: "__expr__"
                model: { refId: C, type: threshold, expression: B, conditions: [{ evaluator: { type: lt, params: [1] } }] }
            labels: { severity: critical }
            annotations: { summary: "No NGINX Gateway Fabric data plane reachable - the entire cluster is unreachable from outside." }
          - uid: alert-npm-down
            title: "NPM (external reverse proxy) down on at least one Pi"
            condition: C
            for: 2m
            data:
              - refId: A
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: prometheus
                model: { refId: A, expr: 'count(nginx_up == 1) or vector(0)' }
              - refId: B
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: "__expr__"
                model: { refId: B, type: reduce, expression: A, reducer: last }
              - refId: C
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: "__expr__"
                model: { refId: C, type: threshold, expression: B, conditions: [{ evaluator: { type: lt, params: [2] } }] }
            labels: { severity: warning }
            annotations: { summary: "NPM is no longer running on both Pis - the HA redundancy of the external reverse proxy is gone." }
          - uid: alert-flux-errors
            title: "Persistent Flux reconcile errors"
            condition: C
            for: 10m
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: prometheus
                model: { refId: A, expr: 'sum(rate(controller_runtime_reconcile_total{result="error"}[10m])) or vector(0)' }
              - refId: B
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: "__expr__"
                model: { refId: B, type: reduce, expression: A, reducer: last }
              - refId: C
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: "__expr__"
                model: { refId: C, type: threshold, expression: B, conditions: [{ evaluator: { type: gt, params: [0] } }] }
            labels: { severity: warning }
            annotations: { summary: "Flux has been reporting persistent reconcile errors for at least 10 minutes - GitOps auto-deploy may not be working." }
          # certmanager_certificate_expiration_timestamp_seconds (new cert-manager scrape job,
          # k8s/14-prometheus.yaml) - without this alert, a silent certificate expiry would make
          # several services (studylife-web, Grafana, Uptime Kuma, piwatch, ...) unreachable all
          # at once before anyone notices. 7-day lead time, since cert-manager itself only
          # attempts renewal 30 days before expiry (renewBefore default) - less than 7 days of
          # remaining lifetime means: automatic renewal is already overdue and hasn't
          # succeeded (yet).
          - uid: alert-cert-expiring
            title: "Certificate expires in less than 7 days"
            condition: C
            for: 15m
            data:
              - refId: A
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: prometheus
                model: { refId: A, expr: '(min(certmanager_certificate_expiration_timestamp_seconds) - time()) / 86400' }
              - refId: B
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: "__expr__"
                model: { refId: B, type: reduce, expression: A, reducer: last }
              - refId: C
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: "__expr__"
                model: { refId: C, type: threshold, expression: B, conditions: [{ evaluator: { type: lt, params: [7] } }] }
            labels: { severity: warning }
            annotations: { summary: "At least one cert-manager certificate expires in less than 7 days - the automatic renewal (30 days ahead) should have taken effect long ago." }
          # From here on: 7 new rules from the previously unused CNPG exporter metrics +
          # Redis/node disk/piwatch. NOT added: a "no successful backup for X hours" alert -
          # verified live, cnpg_collector_last_available_backup_timestamp is permanently stuck
          # at 0 for us (presumably a limitation of the classic barmanObjectStore path, see the
          # Barman Cloud deprecation note above, not of the newer plugin backup path) and
          # cnpg_collector_last_failed_backup_timestamp shows a long-superseded one-off failure
          # (~16h old), even though the actual ScheduledBackup has long since run cleanly again
          # according to "kubectl get backup" - an alert on this metric would fire incorrectly
          # and permanently from day 1. Until a more reliable metric exists, backup success
          # remains a manual/quarterly check (see "Postgres backups to Cloudflare R2").
          - uid: alert-cnpg-replication-lag
            title: "Postgres replication lag too high"
            condition: C
            for: 3m
            data:
              - refId: A
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: prometheus
                model: { refId: A, expr: 'max(cnpg_pg_replication_lag) or vector(0)' }
              - refId: B
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: "__expr__"
                model: { refId: B, type: reduce, expression: A, reducer: last }
              - refId: C
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: "__expr__"
                model: { refId: C, type: threshold, expression: B, conditions: [{ evaluator: { type: gt, params: [60] } }] }
            labels: { severity: warning }
            annotations: { summary: "At least one CNPG replica is more than 60 seconds behind the primary - a failover would lose that much data." }
          # `or vector(86400)`: the archiver metric is exported by the PRIMARY only, so during a
          # switchover the series moves from one instance to the next and the query is briefly
          # empty. Without a fallback Grafana turns that gap into a NoData notification - i.e. a
          # false alarm at exactly the moment a real database event happens (seen 2026-09-13
          # during the 16.4 -> 16.15 upgrade). A large fallback reads as "no recent failure".
          - uid: alert-cnpg-wal-archive-failed
            title: "Postgres WAL archiving is currently failing"
            condition: C
            for: 2m
            data:
              - refId: A
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: prometheus
                model: { refId: A, expr: 'min(cnpg_pg_stat_archiver_seconds_since_last_failure) or vector(86400)' }
              - refId: B
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: "__expr__"
                model: { refId: B, type: reduce, expression: A, reducer: last }
              - refId: C
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: "__expr__"
                model: { refId: C, type: threshold, expression: B, conditions: [{ evaluator: { type: lt, params: [300] } }] }
            labels: { severity: critical }
            annotations: { summary: "A WAL segment could not be archived in the last 5 minutes - without a fix the backlog keeps growing and, in the worst case, fills the storage volume." }
          - uid: alert-cnpg-xid-wraparound
            title: "Postgres transaction ID wraparound risk"
            condition: C
            for: 10m
            data:
              - refId: A
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: prometheus
                model: { refId: A, expr: 'max(cnpg_pg_database_xid_age) or vector(0)' }
              - refId: B
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: "__expr__"
                model: { refId: B, type: reduce, expression: A, reducer: last }
              - refId: C
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: "__expr__"
                model: { refId: C, type: threshold, expression: B, conditions: [{ evaluator: { type: gt, params: [150000000] } }] }
            labels: { severity: warning }
            annotations: { summary: "At least one database is approaching transaction ID wraparound (the autovacuum_freeze_max_age default is 200 million) - check autovacuum, otherwise a database-wide write stop is imminent." }
          - uid: alert-cnpg-manual-intervention
            title: "Postgres needs manual intervention (switchover/fencing)"
            condition: C
            for: 1m
            data:
              - refId: A
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: prometheus
                model: { refId: A, expr: '(max(cnpg_collector_manual_switchover_required) or vector(0)) + (max(cnpg_collector_fencing_on) or vector(0))' }
              - refId: B
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: "__expr__"
                model: { refId: B, type: reduce, expression: A, reducer: last }
              - refId: C
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: "__expr__"
                model: { refId: C, type: threshold, expression: B, conditions: [{ evaluator: { type: gt, params: [0] } }] }
            labels: { severity: critical }
            annotations: { summary: "CNPG reports a required manual switchover or a fenced instance - the operator can no longer resolve the problem on its own." }
          - uid: alert-redis-memory-pressure
            title: "Redis memory close to maxmemory"
            condition: C
            for: 5m
            data:
              - refId: A
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: prometheus
                model: { refId: A, expr: '(max(redis_memory_used_bytes) / 100663296) * 100 or vector(0)' }
              - refId: B
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: "__expr__"
                model: { refId: B, type: reduce, expression: A, reducer: last }
              - refId: C
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: "__expr__"
                model: { refId: C, type: threshold, expression: B, conditions: [{ evaluator: { type: gt, params: [85] } }] }
            labels: { severity: warning }
            annotations: { summary: "At least one Redis node uses more than 85% of its maxmemory limit (96MB) - eviction under allkeys-lru is running, the cache hit rate may drop." }
          - uid: alert-node-disk-low
            title: "Low disk space on at least one Pi"
            condition: C
            for: 10m
            data:
              - refId: A
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: prometheus
                model: { refId: A, expr: 'min((node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100)' }
              - refId: B
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: "__expr__"
                model: { refId: B, type: reduce, expression: A, reducer: last }
              - refId: C
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: "__expr__"
                model: { refId: C, type: threshold, expression: B, conditions: [{ evaluator: { type: lt, params: [15] } }] }
            labels: { severity: warning }
            annotations: { summary: "At least one Pi has less than 15% free disk space on its SD card / root filesystem." }
          - uid: alert-piwatch-down
            title: "piwatch unreachable"
            condition: C
            for: 2m
            data:
              - refId: A
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: prometheus
                model: { refId: A, expr: 'min(kube_deployment_status_replicas_available{namespace="monitoring",deployment="piwatch"}) or vector(0)' }
              - refId: B
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: "__expr__"
                model: { refId: B, type: reduce, expression: A, reducer: last }
              - refId: C
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: "__expr__"
                model: { refId: C, type: threshold, expression: B, conditions: [{ evaluator: { type: lt, params: [1] } }] }
            labels: { severity: warning }
            annotations: { summary: "No piwatch pod is running any more - the live K8s dashboard is unreachable (Uptime Kuma/Grafana/Postgres/Redis themselves are unaffected)." }
          # From here on: 7 more rules closing gaps found during a review of what's actually
          # scraped (k8s/14-prometheus.yaml) vs. what's actually alerted on - all metrics already
          # verified live via existing dashboards (k8s/17b/17c), same principle as above.
          - uid: alert-studylife-ai-down
            title: "studylife-ai unreachable"
            condition: C
            for: 2m
            data:
              - refId: A
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: prometheus
                model: { refId: A, expr: 'count(up{job="studylife-ai"} == 1) or vector(0)' }
              - refId: B
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: "__expr__"
                model: { refId: B, type: reduce, expression: A, reducer: last }
              - refId: C
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: "__expr__"
                model: { refId: C, type: threshold, expression: B, conditions: [{ evaluator: { type: lt, params: [1] } }] }
            labels: { severity: warning }
            annotations: { summary: "No studylife-ai pod responds on /metrics - the RAG chat feature is down, the core app (notes/courses/sessions) is unaffected." }
          - uid: alert-studylife-mcp-down
            title: "studylife-mcp unreachable"
            condition: C
            for: 2m
            data:
              - refId: A
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: prometheus
                model: { refId: A, expr: 'count(up{job="studylife-mcp"} == 1) or vector(0)' }
              - refId: B
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: "__expr__"
                model: { refId: B, type: reduce, expression: A, reducer: last }
              - refId: C
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: "__expr__"
                model: { refId: C, type: threshold, expression: B, conditions: [{ evaluator: { type: lt, params: [1] } }] }
            labels: { severity: warning }
            annotations: { summary: "No studylife-mcp pod responds on /metrics - MCP clients can no longer access StudyLife, the web app itself is unaffected." }
          - uid: alert-studylife-mcp-error-rate
            title: "studylife-mcp tool call error rate high"
            condition: C
            for: 10m
            noDataState: OK
            data:
              - refId: A
                relativeTimeRange: { from: 900, to: 0 }
                datasourceUid: prometheus
                # 15m window instead of the usual 5m, because the call volume is naturally low
                # (a few tool calls per conversation) - short windows would be too noisy.
                # BUG found live: 0/0 (no calls at all within the window) does not produce a 0 in
                # PromQL, it produces NO RESULT AT ALL (NaN is filtered out of the vector) - contrary
                # to what was assumed, Grafana does NOT treat an empty query as "condition not met",
                # it fires its own "DatasourceNoData" alert by default. clamp_min keeps the
                # denominator away from a true 0 (the division stays defined), the outer
                # "or vector(0)" additionally covers the case where the counter metric has never
                # been incremented and therefore no time series exists at all - noDataState: OK
                # above as an extra safeguard for anything that slips through anyway (e.g. a short
                # datasource timeout).
                model: { refId: A, expr: '(sum(rate(studylife_mcp_tool_calls_total{status="error"}[15m])) / clamp_min(sum(rate(studylife_mcp_tool_calls_total[15m])), 0.0001)) or vector(0)' }
              - refId: B
                relativeTimeRange: { from: 900, to: 0 }
                datasourceUid: "__expr__"
                model: { refId: B, type: reduce, expression: A, reducer: last }
              - refId: C
                relativeTimeRange: { from: 900, to: 0 }
                datasourceUid: "__expr__"
                model: { refId: C, type: threshold, expression: B, conditions: [{ evaluator: { type: gt, params: [0.05] } }] }
            labels: { severity: warning }
            annotations: { summary: "More than 5% of the studylife-mcp tool calls in the last 15 minutes are failing - points to a broken tool or a StudyLife API error." }
          - uid: alert-coredns-down
            title: "CoreDNS unreachable"
            condition: C
            for: 2m
            data:
              - refId: A
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: prometheus
                model: { refId: A, expr: 'count(up{job="coredns"} == 1) or vector(0)' }
              - refId: B
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: "__expr__"
                model: { refId: B, type: reduce, expression: A, reducer: last }
              - refId: C
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: "__expr__"
                model: { refId: C, type: threshold, expression: B, conditions: [{ evaluator: { type: lt, params: [1] } }] }
            labels: { severity: critical }
            annotations: { summary: "CoreDNS runs with only 1 replica (verified live) - if it fails, cluster-internal name resolution is gone entirely, which affects practically every other service." }
          - uid: alert-metallb-degraded
            title: "MetalLB degraded (controller or speaker down)"
            condition: C
            for: 2m
            data:
              - refId: A
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: prometheus
                # Additive instead of separate alerts, same pattern as alert-cnpg-manual-intervention:
                # a controller outage (no new LB IP assignments) and a speaker outage (one Pi no
                # longer announces its VIPs via L2) are both "MetalLB degraded", and their severity
                # does not differ enough to justify two rules. Verified live: 1 controller +
                # 2 speakers (one per Pi).
                model: { refId: A, expr: '((count(up{job="metallb",component="controller"} == 1) or vector(0)) < bool 1) + ((count(up{job="metallb",component="speaker"} == 1) or vector(0)) < bool 2)' }
              - refId: B
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: "__expr__"
                model: { refId: B, type: reduce, expression: A, reducer: last }
              - refId: C
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: "__expr__"
                model: { refId: C, type: threshold, expression: B, conditions: [{ evaluator: { type: gt, params: [0] } }] }
            labels: { severity: warning }
            annotations: { summary: "The MetalLB controller or at least one speaker pod is down - LoadBalancer IP assignment or L2 announcement on at least one Pi is impaired." }
          - uid: alert-log-pipeline-degraded
            title: "Log pipeline degraded (Loki/Promtail)"
            condition: C
            for: 5m
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: prometheus
                # Additive, same pattern as MetalLB above: Loki down, too few Promtail pods
                # (expected: 2, one per node) and actually dropped lines are three independent
                # symptoms of the same pipeline - exactly the two failure modes found during the
                # first real deploy (docs/decisions.md in the studylife-mcp repo).
                model: { refId: A, expr: '((count(up{job="loki"} == 1) or vector(0)) < bool 1) + ((count(up{job="promtail"} == 1) or vector(0)) < bool 2) + ((sum(rate(promtail_dropped_entries_total[10m])) or vector(0)) > bool 0)' }
              - refId: B
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: "__expr__"
                model: { refId: B, type: reduce, expression: A, reducer: last }
              - refId: C
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: "__expr__"
                model: { refId: C, type: threshold, expression: B, conditions: [{ evaluator: { type: gt, params: [0] } }] }
            labels: { severity: warning }
            annotations: { summary: "Loki is down, fewer than one Promtail pod per node is running, or Promtail is currently dropping log lines - log aggregation is impaired, app functionality itself is not." }
          - uid: alert-pod-restart-storm
            title: "Unusually many pod restarts cluster-wide"
            condition: C
            for: 5m
            data:
              - refId: A
                relativeTimeRange: { from: 1800, to: 0 }
                datasourceUid: prometheus
                # Deliberately WITHOUT a namespace filter (unlike the existing restarts panel in the
                # overview dashboard, which only shows studylife-scale) - a cluster-wide early
                # warning signal for "something is crash-looping right now", no matter which
                # namespace it happens in.
                model: { refId: A, expr: 'sum(increase(kube_pod_container_status_restarts_total[30m])) or vector(0)' }
              - refId: B
                relativeTimeRange: { from: 1800, to: 0 }
                datasourceUid: "__expr__"
                model: { refId: B, type: reduce, expression: A, reducer: last }
              - refId: C
                relativeTimeRange: { from: 1800, to: 0 }
                datasourceUid: "__expr__"
                model: { refId: C, type: threshold, expression: B, conditions: [{ evaluator: { type: gt, params: [5] } }] }
            labels: { severity: warning }
            annotations: { summary: "More than 5 container restarts in the last 30 minutes, summed across all namespaces - points to an acute crash-loop problem somewhere in the cluster." }
          # "Who watches the watchman": Uptime Kuma monitors all other services (including
          # Grafana itself), but so far nothing monitored Uptime Kuma - if it fails, both the
          # external reachability check and the Telegram notification silently disappear.
          # Same pattern as alert-piwatch-down.
          - uid: alert-uptime-kuma-down
            title: "Uptime Kuma unreachable"
            condition: C
            for: 2m
            data:
              - refId: A
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: prometheus
                model: { refId: A, expr: 'min(kube_deployment_status_replicas_available{namespace="monitoring",deployment="uptime-kuma"}) or vector(0)' }
              - refId: B
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: "__expr__"
                model: { refId: B, type: reduce, expression: A, reducer: last }
              - refId: C
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: "__expr__"
                model: { refId: C, type: threshold, expression: B, conditions: [{ evaluator: { type: lt, params: [1] } }] }
            labels: { severity: warning }
            annotations: { summary: "No uptime-kuma pod is running any more - the external reachability check AND the Telegram notification fail at the same time, with nothing else reporting it." }
          # autodoc was the last app without a reachability rule - and the nightly collector
          # push can fail silently (the docs just go stale). Both metrics verified live before
          # adding: kube_deployment_status_replicas_available existed already, jobs/cronjobs
          # were added to kube-state-metrics' restricted --resources list for the second rule
          # (03-kube-state-metrics.yaml).
          - uid: alert-autodoc-down
            title: "homelab-autodoc unreachable"
            condition: C
            for: 2m
            data:
              - refId: A
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: prometheus
                model: { refId: A, expr: 'min(kube_deployment_status_replicas_available{namespace="homelab-autodoc",deployment="autodoc-server"}) or vector(0)' }
              - refId: B
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: "__expr__"
                model: { refId: B, type: reduce, expression: A, reducer: last }
              - refId: C
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: "__expr__"
                model: { refId: C, type: threshold, expression: B, conditions: [{ evaluator: { type: lt, params: [1] } }] }
            labels: { severity: warning }
            annotations: { summary: "No autodoc-server pod is running any more - the cluster documentation (autodoc.lukas2311-homelab.com) is gone and nightly collector pushes go nowhere." }
          # Fires when the last SUCCESSFUL collector job finished more than 26h ago (nightly
          # schedule is 02:00, so >26h means at least one full run was missed or failed).
          # kube_job_status_completion_time only exists for succeeded jobs, and the CronJob
          # keeps 3 successful jobs of history - so the metric is always present in healthy
          # operation. The "or vector(0)" makes a MISSING metric (collector never succeeded,
          # kube-state-metrics broken) count as infinitely stale instead of NoData-silence.
          - uid: alert-autodoc-collector-stale
            title: "autodoc collector push overdue (last success more than 26h ago)"
            condition: C
            for: 15m
            data:
              - refId: A
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: prometheus
                model: { refId: A, expr: 'time() - (max(kube_job_status_completion_time{namespace="homelab-autodoc",job_name=~"autodoc-collector.*"}) or vector(0))' }
              - refId: B
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: "__expr__"
                model: { refId: B, type: reduce, expression: A, reducer: last }
              - refId: C
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: "__expr__"
                model: { refId: C, type: threshold, expression: B, conditions: [{ evaluator: { type: gt, params: [93600] } }] }
            labels: { severity: warning }
            annotations: { summary: "The nightly autodoc collector run (02:00) has not succeeded for more than 26 hours - the docs site shows stale data (the freshness stamp is only checked by whoever actively looks)." }
          # Same staleness pattern as the collector rule above, for the Velero nightly PVC
          # backup (03:00, cluster/10-velero-values.yaml). Metric verified live after the
          # first manual backup run; "or vector(0)" again turns a missing metric (Velero
          # down, never succeeded) into infinitely-stale instead of NoData-silence.
          # max_over_time added after a live false alarm (24->25.08): a fresh Velero pod
          # exports the gauge only after the schedule's next success, so the helm upgrade
          # at 23:42 made it vanish and the rule fired until the 05:00 backup resolved it.
          # The 26h lookback keeps the last success visible across restart gaps, while a
          # genuinely stale or absent Velero still ages out of the window and fires.
          - uid: alert-velero-backup-stale
            title: "Velero PVC backup overdue (last success more than 26h ago)"
            condition: C
            for: 15m
            data:
              - refId: A
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: prometheus
                model: { refId: A, expr: 'time() - (max(max_over_time(velero_backup_last_successful_timestamp{schedule="velero-nightly-pvc"}[26h])) or vector(0))' }
              - refId: B
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: "__expr__"
                model: { refId: B, type: reduce, expression: A, reducer: last }
              - refId: C
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: "__expr__"
                model: { refId: C, type: threshold, expression: B, conditions: [{ evaluator: { type: gt, params: [93600] } }] }
            labels: { severity: warning }
            annotations: { summary: "The nightly Velero backup of the app PVCs (03:00 to R2) has not succeeded for more than 26 hours - uptime-kuma/grafana/autodoc/homelab-hub/qdrant data have no current offsite copy." }
