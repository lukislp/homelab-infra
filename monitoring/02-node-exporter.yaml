# Host-level CPU/memory/disk/network per node - basis for the cluster overview dashboard.
# DaemonSet (one pod PER node, automatic), hostNetwork/hostPID needed so the container sees
# the actual host instead of its own cgroup.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: monitoring
spec:
  selector:
    matchLabels: { app: node-exporter }
  template:
    metadata:
      labels: { app: node-exporter }
    spec:
      hostNetwork: true
      hostPID: true
      containers:
        - name: node-exporter
          image: prom/node-exporter:v1.8.2
          args:
            - --path.rootfs=/host
          ports:
            - containerPort: 9100
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
          # Declares what the image already does (runs as nobody/65534) so the
          # posture is enforced, not incidental - no data-ownership migration
          # needed, the PVC files were always written by this UID.
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          livenessProbe:
            httpGet: { path: /, port: 9100 }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /, port: 9100 }
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: rootfs
              mountPath: /host
              readOnly: true
      volumes:
        - name: rootfs
          hostPath: { path: / }
