# Host-level CPU/memory/disk/network per node - basis for the cluster overview dashboard.
# DaemonSet (one pod PER node, automatic), hostNetwork/hostPID needed so the container sees
# the actual host instead of its own cgroup.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: monitoring
spec:
  selector:
    matchLabels: { app: node-exporter }
  template:
    metadata:
      labels: { app: node-exporter }
    spec:
      tolerations:
        # This DaemonSet must run on EVERY node including the control-plane Pi - a node
        # with no host-metrics exporter is a blind spot, not a saved resource.
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
        - key: node-role.kubernetes.io/master
          operator: Exists
        # pinode01 additionally carries studylife/relief:NoSchedule (keeps app workloads off
        # the control-plane node after the 2026-09 Longhorn rebalance). A NoSchedule taint
        # does not evict, so the pods that were already running there survived it unnoticed -
        # until the first rollout of this DaemonSet, which silently dropped pinode01 from 3
        # nodes to 2. Same toleration piwatch's node-agent already carries, for the same
        # reason: a monitoring agent is not an app workload.
        - key: studylife/relief
          operator: Exists
      hostNetwork: true
      hostPID: true
      containers:
        - name: node-exporter
          # Pinned by the multi-arch index digest (arm64 entry verified) on top of the
          # readable tag: the tag alone still resolves through a mutable registry pointer, the
          # digest is what containerd actually pulls. Renovate keeps tag and digest in step.
          # v1.8.2 -> v1.12.1: minor bumps within the same major, no metric this cluster uses
          # was renamed or removed. The one thing worth knowing is the meminfo collector
          # rewrite in v1.9.0, which maps a fixed struct instead of parsing whatever
          # /proc/meminfo happens to contain - a handful of exotic node_memory_* series
          # (FileHugePages, FilePmdMapped, Hugetlb) disappeared upstream. None of them are
          # referenced by any dashboard or alert rule here, checked before the bump.
          image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
          args:
            - --path.rootfs=/host
          ports:
            - containerPort: 9100
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
          # Declares what the image already does (runs as nobody/65534) so the
          # posture is enforced, not incidental - no data-ownership migration
          # needed, the PVC files were always written by this UID.
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          livenessProbe:
            httpGet: { path: /, port: 9100 }
            initialDelaySeconds: 10
            periodSeconds: 15
            # timeoutSeconds/failureThreshold raised deliberately (2026-09-13): with the
            # Kubernetes default timeoutSeconds: 1 these probes were the single biggest
            # restart trigger in this cluster. pinode03 is a 4 GB arm64 node that runs with
            # well under 1 GB available and swap in use; during a load spike an HTTP probe
            # routinely needs longer than one second to answer, kubelet counts that as a
            # failure and kills a perfectly healthy container. At 1 s the probe measures node
            # load, not process health - 5 s plus a wider failure window restores it as a
            # health signal. Probe path/port/type are deliberately unchanged.
            # failureThreshold 5 (not 3) because this is one of the monitoring DaemonSets:
            # they are the noisiest probe-timeout offenders and the least critical thing in
            # the cluster - a stale exporter costs a scrape gap, a restart loop costs real
            # CPU on the node that is already the bottleneck.
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet: { path: /, port: 9100 }
            initialDelaySeconds: 5
            periodSeconds: 10
            # Same reasoning as the liveness probe above.
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: rootfs
              mountPath: /host
              readOnly: true
      volumes:
        - name: rootfs
          hostPath: { path: / }
