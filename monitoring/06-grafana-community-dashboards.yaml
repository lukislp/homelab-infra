# Community dashboards for technical depth (not optimized for human readability like
# 17b-grafana-dashboards.yaml - here you're meant to see as much as possible). Verified live
# against the local test cluster (Node Exporter Full: 238/284 panel queries with real data, the
# rest are hardware sensors missing in this virtualized test environment but expected to work
# on the real Pi nodes - e.g. temperature, CPU frequency scaling, power supply, pressure stall
# info; Redis dashboard: 19/19). Source/version:
#   - Node Exporter Full: https://grafana.com/grafana/dashboards/1860-node-exporter-full/ (ID 1860)
#   - Redis Dashboard: https://grafana.com/grafana/dashboards/763-redis-dashboard-for-prometheus-redis-exporter-1-x/ (ID 763)
#   - Loki Kubernetes Logs: https://grafana.com/grafana/dashboards/15141-kubernetes-service-logs/
#     (ID 15141, official Grafana Labs solution, 1M+ downloads, revision 1)
# Vendored/taken over as-is (original authors, not written by us) - do NOT edit by hand, pull a
# new revision from grafana.com if needed and repeat the same adaptation step:
#   - Node Exporter Full: unchanged (job/node variables resolve correctly for us automatically).
#   - Redis: $namespace template variable removed (our redis_exporter doesn't set a "namespace"
#     label) and the $instance variable wired directly to redis_up.
#   - Loki Kubernetes Logs: $stream template variable and its {stream=~"$stream"} selector
#     removed - our promtail (k8s/19-promtail.yaml) extracts namespace/pod/container from the
#     hostPath file path but never sets a "stream" label, so the original filter would have
#     matched zero log lines. ${DS_LOKI} template datasource refs resolved to the fixed
#     uid "loki" (k8s/17-grafana.yaml datasources). Deliberately basic (one volume chart, one
#     log list, three filters) - see logs.json in k8s/17b-grafana-dashboards.yaml for the
#     hand-built dashboard with level/pod breakdowns, top-noisiest tables and a dedicated
#     errors-only view.
